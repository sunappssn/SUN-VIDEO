<title>SUN VIDEO - Mon profil</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* HEADER */

header{
    height:65px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#e60000;
}

.logo a{
    color:#e60000;
    text-decoration:none;
}

/* CONTENU */

.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

/* PROFIL */

.profile-card{
    background:white;
    border-radius:15px;
    padding:35px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    text-align:center;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#e60000;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
    font-size:40px;
    font-weight:bold;
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

.email{
    color:#777;
    margin-bottom:25px;
}

/* INFORMATIONS */

.info{
    background:#f5f5f5;
    border-radius:10px;
    padding:18px;
    margin-top:20px;
    text-align:left;
}

.info-title{
    font-size:13px;
    color:#777;
    margin-bottom:5px;
}

.info-value{
    font-size:16px;
    font-weight:bold;
}

/* BOUTONS */

.buttons{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:30px;
}

.button{
    border:none;
    padding:12px 20px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    font-size:15px;
}

.home{
    background:#111;
    color:white;
}

.logout{
    background:#e60000;
    color:white;
}

.button:hover{
    opacity:.85;
}

/* VIDEOS */

.videos{
    margin-top:30px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.videos h2{
    margin-bottom:10px;
}

.videos p{
    color:#777;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        margin:20px auto;
        padding:15px;
    }

    .profile-card{
        padding:25px 18px;
    }

    h1{
        font-size:24px;
    }

}

</style>

</head>
