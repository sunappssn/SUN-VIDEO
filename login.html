<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUN VIDEO - Connexion</title>

<style>

*{
box-sizing:border-box;
margin:0;

font-family:Arial,sans-serif;
}

body{
min-height:100vh;

}

.container{

h1{

.subtitle{

label{

input{

input:focus{

button{

button:hover{

.register{

.register a{

}

</style>

</head>

<body>


<div class="container">


<div class="logo">
▶ SUN VIDEO
</div>


<div class="card">


<h1>
Se connecter
</h1>


<p class="subtitle">
Connecte-toi à ton compte SUN VIDEO.
</p>


<form id="loginForm">


<label>
Email
</label>

<input
id="email"
type="email"
placeholder="exemple@email.com"
required
>


<label>
Mot de passe
</label>

<input
id="password"
type="password"
placeholder="Ton mot de passe"
required
>


<button type="submit">
Se connecter
</button>


</form>


<div
id="message"
class="message"
></div>


<div class="register">

</div>

<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {


apiKey:

"AIzaSyCGwgzSrM2Z5-AW-Gjx4DJRpJzrdZ4s",


authDomain:

"sun-video-8a3bd.firebaseapp.com",


projectId:

"sun-video-8a3bd",


storageBucket:

"sun-video-8a3bd.firebasestorage.app",


messagingSenderId:

"271262523518",


appId:

"1:271262523518:web:f6b5997c3a5e34dec9782f"


};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const form =
document.getElementById(
"loginForm"
);


const message =
document.getElementById(
"message"
);


form.addEventListener(
"submit",
async function(event){

event.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


message.innerText =
"Connexion en cours...";

message.style.color =
"#555";


try{


await signInWithEmailAndPassword(
auth,
email,
password
);


message.innerText =
"✅ Connexion réussie !";

message.style.color =
"green";


setTimeout(
function(){

window.location.href =
"index.html";

},
1000
);


}

catch(error){


console.error(error);


if(
error.code ===
"auth/invalid-credential"
){

message.innerText =
"❌ Email ou mot de passe incorrect.";

}

else if(
error.code ===
"auth/user-not-found"
){

message.innerText =
"❌ Aucun compte trouvé avec cet email.";

}

else if(
error.code ===
"auth/wrong-password"
){

message.innerText =
"❌ Mot de passe incorrect.";

}

else if(
error.code ===
"auth/invalid-email"
){

message.innerText =
"❌ Adresse email invalide.";

}

else{

message.innerText =
"❌ Impossible de se connecter. Réessaie.";

}


message.style.color =
"red";

}

});


</script>


</body>
