<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUN VIDEO - Connexion</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f5f5;
}

.container{
    width:100%;
    max-width:450px;
    padding:20px;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#e60000;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:18px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#e60000;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:25px;
    background:#e60000;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#c90000;
}

#message{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#e60000;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#555;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">
▶ SUN VIDEO
</div>

<div class="card">

<h1>
Se connecter
</h1>

<p class="subtitle">
Connecte-toi à ton compte SUN VIDEO.
</p>

<form id="loginForm">

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="[exemple@email.com](mailto:exemple@email.com)"
required

>

<label>
Mot de passe
</label>

<input
id="password"
type="password"
placeholder="Ton mot de passe"
required

>

<button type="submit">
Se connecter
</button>

</form>

<div id="message"></div>

<div class="register">
Tu n'as pas encore de compte ?
<a href="register.html">
Créer un compte
</a>
</div>

<a
class="back"
href="index.html"

>

← Retour à SUN VIDEO </a>

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
getAuth,
setPersistence,
browserLocalPersistence,
signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyCGwgzSrM2Z5-AW-Gjx4DJRp-RpJzrdZ4s",

authDomain:
"sun-video-8a3bd.firebaseapp.com",

projectId:
"sun-video-8a3bd",

storageBucket:
"sun-video-8a3bd.firebasestorage.app",

messagingSenderId:
"271262523518",

appId:
"1:271262523518:web:f6b5997c3a5e34dec9782f"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");


form.addEventListener(
"submit",
async function(event){

event.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


message.innerHTML =
"⏳ Connexion en cours...";

message.style.color =
"#555";


try{

await setPersistence(
auth,
browserLocalPersistence
);


const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);


const user =
userCredential.user;


console.log(
"CONNEXION RÉUSSIE :",
user
);


message.innerHTML =
"✅ Connexion réussie ! Tu peux maintenant retourner sur SUN VIDEO.";


message.style.color =
"green";


}

catch(error){

console.error(
"ERREUR FIREBASE :",
error
);


if(
error.code ===
"auth/invalid-credential"
){

message.innerHTML =
"❌ Email ou mot de passe incorrect.";

}

else if(
error.code ===
"auth/invalid-email"
){

message.innerHTML =
"❌ Adresse email invalide.";

}

else if(
error.code ===
"auth/operation-not-allowed"
){

message.innerHTML =
"❌ La connexion par email n'est pas activée dans Firebase.";

}

else if(
error.code ===
"auth/network-request-failed"
){

message.innerHTML =
"❌ Problème de connexion Internet.";

}

else{

message.innerHTML =
"❌ Erreur : " +
error.code;

}


message.style.color =
"red";

}

});

</script>

</body>
</html>
