<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUN VIDEO - Inscription</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f5f5f5;
}

.container{
width:100%;
max-width:450px;
padding:20px;
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#e60000;
margin-bottom:30px;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
font-size:25px;
margin-bottom:10px;
}

.subtitle{
color:#666;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:7px;
font-weight:bold;
}

input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:18px;
outline:none;
font-size:15px;
}

input:focus{
border-color:#e60000;
}

button{
width:100%;
padding:13px;
border:0;
border-radius:25px;
background:#e60000;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#c90000;
}

.login{
text-align:center;
margin-top:20px;
color:#666;
}

.login a{
color:#e60000;
font-weight:bold;
text-decoration:none;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#555;
text-decoration:none;
}

.message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
▶ SUN VIDEO
</div>

<div class="card">

<h1>
Créer un compte
</h1>

<p class="subtitle">
Rejoins gratuitement SUN VIDEO.
</p>

<form id="registerForm">

<label>
Nom d'utilisateur
</label>

<input
id="username"
type="text"
placeholder="Exemple : Sun Music"
required
>

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="exemple@email.com"
required
>

<label>
Mot de passe
</label>

<input
id="password"
type="password"
placeholder="Minimum 6 caractères"
minlength="6"
required
>

<label>
Confirmer le mot de passe
</label>

<input
id="confirmPassword"
type="password"
placeholder="Retape ton mot de passe"
minlength="6"
required
>

<button type="submit">
Créer mon compte
</button>

</form>

<div id="message" class="message"></div>

<div class="login">

Tu as déjà un compte ?

<a href="login.html">
Se connecter
</a>

</div>

<a class="back" href="index.html">
← Retour à SUN VIDEO
</a>

</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
updateProfile
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyCGwgzSrM2Z5-AW-Gjx4DJBR-RpJzrdZ4s",

authDomain: "sun-video-8a3bd.firebaseapp.com",

projectId: "sun-video-8a3bd",

storageBucket: "sun-video-8a3bd.firebasestorage.app",

messagingSenderId: "271262523518",

appId: "1:271262523518:web:f6b5997c3a5e34dec9782f"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const form =
document.getElementById("registerForm");

const message =
document.getElementById("message");


form.addEventListener("submit", async function(event){

event.preventDefault();


const username =
document.getElementById("username").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;


if(password !== confirmPassword){

message.innerText =
"❌ Les mots de passe ne correspondent pas.";

message.style.color="red";

return;

}


if(password.length < 6){

message.innerText =
"❌ Le mot de passe doit avoir au moins 6 caractères.";

message.style.color="red";

return;

}


message.innerText =
"Création du compte...";

message.style.color="#555";


try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);


await updateProfile(
userCredential.user,
{
displayName: username
}
);


message.innerText =
"✅ Compte créé avec succès !";

message.style.color="green";


setTimeout(function(){

window.location.href="index.html";

},1500);


}catch(error){

console.error(error);


if(error.code === "auth/email-already-in-use"){

message.innerText =
"❌ Cette adresse e-mail possède déjà un compte.";

}

else if(error.code === "auth/invalid-email"){

message.innerText =
"❌ Adresse e-mail invalide.";

}

else if(error.code === "auth/weak-password"){

message.innerText =
"❌ Mot de passe trop faible.";

}

else{

message.innerText =
"❌ Une erreur est survenue. Réessaie.";

}

message.style.color="red";

}

});

</script>

</body>

</html>
