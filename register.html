<!DOCTYPE html>

<body>

<div class="container">

<div class="logo">

<div class="card">

Créer un compte
</h1>

Rejoins gratuitement SUN VIDEO.
</p>

<label>
Nom d'utilisateur
</label>

<input
id="username"

required
>

<label>
Email
</label>

id="email"

required
>

Mot de passe
</label>

id="password"

required

required
>

</button>

</form>

<div

</div>

<div class="login">

Se connecter
</a>

</div>

<a
class="back"
href="index.html">

</a>

</div>

</div>


<script>

function register(event){

event.preventDefault();

const username =
document.getElementById("username").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const message =
document.getElementById("message");


if(password !== confirmPassword){

message.innerText =
"❌ Les mots de passe ne correspondent pas.";

message.style.color="red";

return;

}


if(password.length < 6){

message.innerText =
"❌ Le mot de passe doit avoir au moins 6 caractères.";

message.style.color="red";

return;

}


message.innerText =
"✅ Formulaire correct !";

message.style.color="green";

}

</script>
