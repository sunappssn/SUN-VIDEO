<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUN VIDEO - Vidéo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      height: 65px;
      background: white;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 25px;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      color: #e60000;
      font-size: 24px;
      font-weight: bold;
    }

    .search {
      flex: 1;
      max-width: 600px;
      margin: auto;
    }

    .search input {
      width: 100%;
      padding: 12px 18px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 15px;
    }

    .back {
      border: none;
      background: #eee;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 70px;
    }

    h1 {
      margin-top: 20px;
      font-size: 25px;
    }

    .channel {
      margin-top: 12px;
      color: #666;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .actions button {
      border: none;
      padding: 12px 20px;
      border-radius: 22px;
      cursor: pointer;
      background: #eee;
      font-weight: bold;
    }

    .actions button:hover {
      background: #ddd;
    }

    .description {
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 10px;
      }

      .logo {
        font-size: 18px;
      }

      .search {
        display: none;
      }

      main {
        margin-top: 15px;
        padding: 0 10px;
      }

      h1 {
        font-size: 20px;
      }

      .player {
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">▶ SUN VIDEO</div>

  <div class="search">
    <input type="text" placeholder="Rechercher une vidéo...">
  </div>

  <button class="back" onclick="history.back()">
    ← Retour
  </button>

</header>

<main>

  <div class="player">
    ▶
  </div>

  <h1>
    Bienvenue sur SUN VIDEO
  </h1>

  <div class="channel">
    SUN VIDEO • 1,2 k vues
  </div>

  <div class="actions">

    <button>👍 J'aime</button>

    <button>💬 Commenter</button>

    <button>↗️ Partager</button>

    <button>🔔 S'abonner</button>

  </div>

  <div class="description">

    <strong>Description</strong>

    <p>
      Bienvenue sur SUN VIDEO, une nouvelle plateforme
      pour regarder et partager des vidéos.
    </p>

  </div>

</main>

</body>
</html>
